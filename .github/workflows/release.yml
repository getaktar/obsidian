name: Release

# Pushing a tag like 0.2.0 (Obsidian wants no "v") builds the plugin and
# attaches main.js, manifest.json and styles.css to a GitHub release, which
# is what Obsidian and BRAT install from.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - run: pnpm check

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes-file <(node scripts/release-notes.mjs "${GITHUB_REF_NAME}")
